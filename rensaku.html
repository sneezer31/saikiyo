<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さいきよ‐れんさく</title>
<style>
  :root { --bg-color: #F8F8F8; --text-color: #111111; --primary: #2C7C73; --btn-bg: #FFFFFF; }
  body { margin: 0; padding: 0; font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); }
  
  .screen { display: none; padding: 20px; flex-direction: column; gap: 15px; max-width: 800px; margin: 0 auto; box-sizing: border-box; }
  .screen.active { display: flex; }

  h2 { margin: 0 0 10px 0; font-size: 1.6rem; border-bottom: 2px solid var(--primary); padding-bottom: 5px; text-align: center; }
  .sub-title { margin: 0; font-size: 1.1rem; font-weight: bold; }

  /* フォーム要素 */
  textarea { width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border: 1px solid #999; border-radius: 4px; resize: vertical; }
  #input-text { height: 200px; }
  
  /* プレビューエリア（箱を無くし、シームレスな表示へ） */
  #preview-area { font-size: 1.1rem; line-height: 2; padding: 10px; white-space: pre-wrap; word-wrap: break-word; }

  .settings-group { border: 1px solid #CCC; padding: 15px; border-radius: 4px; background: #FFF; display: flex; flex-direction: column; gap: 10px; }
  .radio-row { display: flex; gap: 15px; align-items: center; font-size: 0.95rem; }
  .radio-label { font-weight: bold; width: 80px; flex-shrink: 0; }

  /* ボタン */
  .btn-group { display: flex; gap: 10px; margin-top: 10px; }
  button { padding: 14px; font-size: 1.1rem; font-weight: bold; background: var(--btn-bg); color: var(--text-color); border: 2px solid var(--text-color); cursor: pointer; border-radius: 4px; flex: 1; }
  button.primary { background: var(--primary); color: #FFF; border-color: var(--primary); }
  button:active { opacity: 0.7; }

  /* ソートエリア */
  #sort-area {
    display: flex; gap: 10px; padding: 15px; background: #EAEAEA; border: 1px inset #CCC; border-radius: 8px; position: relative;
  }
  
  /* 短冊の基本スタイル */
  .tanzaku {
    background-color: #FFF; border: 1px solid #666; border-radius: 2px; box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    padding: 10px; cursor: grab; user-select: none; touch-action: none;
  }
  
  /* 抜け殻（プレースホルダー） */
  .placeholder {
    background-color: rgba(0,0,0,0.05); border: 1px dashed #999; border-radius: 2px; box-shadow: none;
  }

  /* ドラッグ中の実体 */
  .dragging {
    position: fixed; pointer-events: none; opacity: 0.9; transform: scale(1.02); box-shadow: 5px 10px 20px rgba(0,0,0,0.25); z-index: 1000;
  }

  /* 動的スタイル適用 */
  .font-mincho { font-family: 'Shippori Mincho', serif; }
  .font-gothic { font-family: sans-serif; }
  
  /* 縦書きモード */
  .dir-vertical { flex-direction: row-reverse; flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; min-height: 250px; }
  .dir-vertical .tanzaku, .dir-vertical .placeholder { writing-mode: vertical-rl; padding: 15px 10px; line-height: 2; flex-shrink: 0; }
  
  /* 縦書きモード時の水平スクロールバーを、スマホの指で掴める太さに強制拡張 */
  .dir-vertical::-webkit-scrollbar {
    height: 30px; 
  }
  .dir-vertical::-webkit-scrollbar-track {
    background: #DDDDDD; 
    border-radius: 4px;
  }
  .dir-vertical::-webkit-scrollbar-thumb {
    background: #888888; 
    border-radius: 4px;
    border: 2px solid #DDDDDD; 
  }
  .dir-vertical::-webkit-scrollbar-thumb:active {
    background: var(--primary); 
  }

  /* 横書きモード */
  .dir-horizontal { flex-direction: column; overflow-y: auto; }
  .dir-horizontal .tanzaku, .dir-horizontal .placeholder { writing-mode: horizontal-tb; width: 100%; box-sizing: border-box; line-height: 1.5; flex-shrink: 0; }

  /* 折り返し設定 */
  .wrap-false .tanzaku { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wrap-true .tanzaku { white-space: pre-wrap; word-break: break-all; }

</style>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
</head>
<body>

<div id="screen1" class="screen active">
  <h2>さいきよ‐れんさく</h2>
  
  <div class="settings-group">
    <div class="radio-row">
      <span class="radio-label">書体</span>
      <label><input type="radio" name="font" value="gothic" checked> ゴシック</label>
      <label><input type="radio" name="font" value="mincho"> 明朝</label>
    </div>
    <div class="radio-row">
      <span class="radio-label">方向</span>
      <label><input type="radio" name="direction" value="horizontal" checked> 横書き</label>
      <label><input type="radio" name="direction" value="vertical"> 縦書き</label>
    </div>
    <div class="radio-row">
      <span class="radio-label">表示</span>
      <label><input type="radio" name="wrap" value="false" checked> 初句のみ</label>
      <label><input type="radio" name="wrap" value="true"> 全文</label>
    </div>
  </div>

  <textarea id="input-text" placeholder="ここに連作を入力してください。&#10;（1首ごとに1行の空行を入れてください）"></textarea>
  
  <div class="btn-group">
    <button type="button" class="primary" onclick="goToScreen2()">次へ</button>
  </div>
</div>

<div id="screen2" class="screen">
  <h2>さいきよ‐れんさく</h2>
  <div class="sub-title">並べ替え</div>
  <div id="sort-area"></div>
  
  <div class="btn-group">
    <button type="button" onclick="goToScreen(1)">戻る</button>
    <button type="button" class="primary" onclick="goToScreen3()">次へ</button>
  </div>
</div>

<div id="screen3" class="screen">
  <h2>さいきよ‐れんさく</h2>
  <div class="sub-title">出力結果</div>
  
  <div id="preview-area"></div>
  
  <div class="btn-group">
    <button type="button" onclick="goToScreen(2)">戻る</button>
    <button type="button" class="primary" onclick="copyToClipboard()">決定（コピー）</button>
  </div>
</div>

<script>
  const screens = [
    document.getElementById('screen1'),
    document.getElementById('screen2'),
    document.getElementById('screen3')
  ];
  const inputText = document.getElementById('input-text');
  const sortArea = document.getElementById('sort-area');
  const previewArea = document.getElementById('preview-area');
  
  let finalResultText = "";
  let draggedItem = null;
  let placeholder = null;
  let currentDirection = 'horizontal';
  let pointerOffsetX = 0;
  let pointerOffsetY = 0;

  function goToScreen(screenNumber) {
    screens.forEach((screen, index) => {
      screen.classList.toggle('active', index === screenNumber - 1);
    });
  }

  function goToScreen2() {
    const rawText = inputText.value;
    const poems = rawText.split(/\n\s*\n/).map(p => p.trim()).filter(p => p !== '');
    if (poems.length === 0) {
      alert("短歌が入力されていません。");
      return;
    }

    const font = document.querySelector('input[name="font"]:checked').value;
    currentDirection = document.querySelector('input[name="direction"]:checked').value;
    const wrap = document.querySelector('input[name="wrap"]:checked').value;

    sortArea.className = '';
    sortArea.classList.add(`font-${font}`, `dir-${currentDirection}`, `wrap-${wrap}`);
    sortArea.innerHTML = '';

    poems.forEach(poem => {
      const tanzaku = document.createElement('div');
      tanzaku.className = 'tanzaku';
      tanzaku.textContent = poem;
      tanzaku.addEventListener('pointerdown', handlePointerDown);
      sortArea.appendChild(tanzaku);
    });
    goToScreen(2);
  }

  function goToScreen3() {
    const tanzakus = Array.from(sortArea.children).filter(el => !el.classList.contains('placeholder') && !el.classList.contains('dragging'));
    finalResultText = tanzakus.map(el => el.textContent).join('\n\n');
    
    const font = document.querySelector('input[name="font"]:checked').value;
    previewArea.className = `font-${font}`;
    previewArea.textContent = finalResultText;
    
    goToScreen(3);
  }

  function copyToClipboard() {
    navigator.clipboard.writeText(finalResultText).then(() => {
      alert("クリップボードにコピーしました！");
    }).catch(err => {
      alert("コピーに失敗しました。");
      console.error(err);
    });
  }

  function handlePointerDown(e) {
    if (e.button !== 0 && e.type !== 'touchstart') return;
    e.preventDefault();

    draggedItem = this;
    const rect = draggedItem.getBoundingClientRect();
    
    placeholder = document.createElement('div');
    placeholder.className = 'placeholder';
    if (currentDirection === 'horizontal') {
      placeholder.style.height = `${rect.height}px`;
    } else {
      placeholder.style.width = `${rect.width}px`;
    }
    
    sortArea.insertBefore(placeholder, draggedItem);
    
    pointerOffsetX = e.clientX - rect.left;
    pointerOffsetY = e.clientY - rect.top;
    
    draggedItem.classList.add('dragging');
    draggedItem.style.width = `${rect.width}px`;
    draggedItem.style.height = `${rect.height}px`;
    draggedItem.style.left = `${rect.left}px`;
    draggedItem.style.top = `${rect.top}px`;
    
    document.body.appendChild(draggedItem);

    document.addEventListener('pointermove', handlePointerMove, { passive: false });
    document.addEventListener('pointerup', handlePointerUp);
    document.addEventListener('pointercancel', handlePointerUp);
  }

  function handlePointerMove(e) {
    if (!draggedItem) return;
    e.preventDefault();

    draggedItem.style.left = `${e.clientX - pointerOffsetX}px`;
    draggedItem.style.top = `${e.clientY - pointerOffsetY}px`;

    const elements = document.elementsFromPoint(e.clientX, e.clientY);
    const target = elements.find(el => el.classList.contains('tanzaku') && el.parentNode === sortArea);

    if (target && target !== placeholder) {
      const items = Array.from(sortArea.children).filter(c => c !== placeholder);
      const rects = items.map(item => ({ item, rect: item.getBoundingClientRect() }));

      const targetRect = target.getBoundingClientRect();
      if (currentDirection === 'vertical') {
        if (e.clientX > targetRect.left + (targetRect.width / 2)) {
          sortArea.insertBefore(placeholder, target);
        } else {
          sortArea.insertBefore(placeholder, target.nextSibling);
        }
      } else {
        if (e.clientY < targetRect.top + (targetRect.height / 2)) {
          sortArea.insertBefore(placeholder, target);
        } else {
          sortArea.insertBefore(placeholder, target.nextSibling);
        }
      }

      rects.forEach(({ item, rect }) => {
        const newRect = item.getBoundingClientRect();
        const dx = rect.left - newRect.left;
        const dy = rect.top - newRect.top;
        if (dx !== 0 || dy !== 0) {
          item.style.transform = `translate(${dx}px, ${dy}px)`;
          item.style.transition = 'none';
          requestAnimationFrame(() => {
            item.style.transform = '';
            item.style.transition = 'transform 0.15s ease-out';
          });
        }
      });
    }
  }

  function handlePointerUp(e) {
    if (!draggedItem) return;
    
    sortArea.insertBefore(draggedItem, placeholder);
    placeholder.remove();
    placeholder = null;

    draggedItem.classList.remove('dragging');
    draggedItem.style = '';
    
    document.removeEventListener('pointermove', handlePointerMove);
    document.removeEventListener('pointerup', handlePointerUp);
    document.removeEventListener('pointercancel', handlePointerUp);
    draggedItem = null;
  }
</script>

</body>
</html>
